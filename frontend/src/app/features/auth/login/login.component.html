<div class="auth-container">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;font-size:28px">
        &#128138;
      </div>
      <h3 class="fw-bold text-primary">Dossiers Médicaux</h3>
      <p class="text-muted small">Système de Gestion Hospitalière</p>
    </div>

    @if (error()) {
      <div class="alert alert-danger alert-dismissible">
        {{ error() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nom d'utilisateur ou Email</label>
        <input type="text" class="form-control form-control-lg"
               [(ngModel)]="credentials.username" name="username"
               placeholder="admin ou admin@medical.com" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Mot de passe</label>
        <input type="password" class="form-control form-control-lg"
               [(ngModel)]="credentials.password" name="password"
               placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100"
              [disabled]="loading() || !loginForm.valid">
        @if (loading()) {
          <span class="spinner-border spinner-border-sm me-2"></span>
        }
        Connexion
      </button>
    </form>

  </div>
</div>
