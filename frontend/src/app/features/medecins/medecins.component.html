<div class="page-content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">&#129657; Médecins</h4>
    <button class="btn btn-primary" (click)="openForm()">&#43; Nouveau médecin</button>
  </div>

  @if (showForm()) {
    <div class="card mb-3 border-primary">
      <div class="card-header bg-primary text-white fw-bold">
        {{ editId ? 'Modifier le médecin' : 'Nouveau médecin' }}
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control" [(ngModel)]="form.nom">
          </div>
          <div class="col-md-3">
            <label class="form-label">Prénom</label>
            <input type="text" class="form-control" [(ngModel)]="form.prenom">
          </div>
          <div class="col-md-3">
            <label class="form-label">Spécialité</label>
            <input type="text" class="form-control" [(ngModel)]="form.specialite" placeholder="Cardiologie...">
          </div>
          <div class="col-md-3">
            <label class="form-label">Service</label>
            <select class="form-select" [(ngModel)]="form.serviceId">
              <option [value]="null">-- Aucun --</option>
              @for (s of services(); track s.id) {
                <option [value]="s.id">{{ s.nomService }}</option>
              }
            </select>
          </div>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary btn-sm" (click)="save()">Enregistrer</button>
          <button class="btn btn-light btn-sm" (click)="showForm.set(false)">Annuler</button>
        </div>
      </div>
    </div>
  }

  <div class="card">
    <div class="card-body p-0">
      @if (loading()) {
        <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
      } @else {
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead>
              <tr><th>Médecin</th><th>Spécialité</th><th>Service</th><th>Actions</th></tr>
            </thead>
            <tbody>
              @for (m of medecins(); track m.id) {
                <tr>
                  <td>
                    <div class="d-flex align-items-center">
                      <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center me-2" style="width:36px;height:36px">
                        {{ m.nom[0] }}
                      </div>
                      <span class="fw-semibold">Dr. {{ m.nom }} {{ m.prenom }}</span>
                    </div>
                  </td>
                  <td><span class="badge bg-info text-dark">{{ m.specialite || '-' }}</span></td>
                  <td>{{ m.service?.nomService || '-' }}</td>
                  <td>
                    <div class="btn-group btn-group-sm">
                      <button class="btn btn-outline-warning" (click)="openForm(m)">&#9999;</button>
                      <button class="btn btn-outline-danger" (click)="delete(m.id)">&#128465;</button>
                    </div>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      }
    </div>
  </div>
</div>
