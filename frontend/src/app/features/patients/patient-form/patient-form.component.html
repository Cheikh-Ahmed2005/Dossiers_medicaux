<div class="page-content">
  <div class="d-flex align-items-center mb-4">
    <a routerLink="/patients" class="btn btn-outline-secondary btn-sm me-3">&#8592; Retour</a>
    <h4 class="fw-bold mb-0">{{ isEdit ? 'Modifier le patient' : 'Nouveau patient' }}</h4>
  </div>

  @if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  }

  @if (loadingData()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary"></div>
      <p class="mt-2 text-muted">Chargement des données...</p>
    </div>
  } @else {
    <div class="card">
      <div class="card-body">
        <form (ngSubmit)="save()" #patientForm="ngForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Nom <span class="text-danger">*</span></label>
              <input type="text" class="form-control" [(ngModel)]="patient.nom" name="nom" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Prénom <span class="text-danger">*</span></label>
              <input type="text" class="form-control" [(ngModel)]="patient.prenom" name="prenom" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Date de naissance</label>
              <input type="date" class="form-control" [(ngModel)]="patient.dateNaissance" name="dateNaissance">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Sexe</label>
              <select class="form-select" [(ngModel)]="patient.sexe" name="sexe">
                <option value="M">Masculin</option>
                <option value="F">Féminin</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Groupe sanguin</label>
              <select class="form-select" [(ngModel)]="patient.groupeSanguin" name="groupeSanguin">
                <option value="">-- Sélectionner --</option>
                <option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option>
                <option>AB+</option><option>AB-</option>
                <option>O+</option><option>O-</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Téléphone</label>
              <input type="tel" class="form-control" [(ngModel)]="patient.telephone" name="telephone">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Adresse</label>
              <input type="text" class="form-control" [(ngModel)]="patient.adresse" name="adresse">
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Allergies connues</label>
              <textarea class="form-control" rows="2" [(ngModel)]="patient.allergies" name="allergies"
                        placeholder="Pénicilline, aspirine..."></textarea>
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary px-4" [disabled]="saving() || !patientForm.valid">
              @if (saving()) { <span class="spinner-border spinner-border-sm me-2"></span> }
              {{ isEdit ? 'Mettre à jour' : 'Enregistrer' }}
            </button>
            <a routerLink="/patients" class="btn btn-light px-4">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  }
</div>
