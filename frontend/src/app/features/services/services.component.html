<div class="page-content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">&#127973; Services Hospitaliers</h4>
    <button class="btn btn-primary" (click)="openForm()">&#43; Nouveau service</button>
  </div>

  @if (showForm()) {
    <div class="card mb-3 border-primary">
      <div class="card-header bg-primary text-white fw-bold">
        {{ editId ? 'Modifier le service' : 'Nouveau service' }}
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-5">
            <label class="form-label">Nom du service</label>
            <input type="text" class="form-control" [(ngModel)]="form.nomService" placeholder="ex: Cardiologie">
          </div>
          <div class="col-md-7">
            <label class="form-label">Description</label>
            <input type="text" class="form-control" [(ngModel)]="form.description">
          </div>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary btn-sm" (click)="save()">Enregistrer</button>
          <button class="btn btn-light btn-sm" (click)="showForm.set(false)">Annuler</button>
        </div>
      </div>
    </div>
  }

  <div class="row g-3">
    @if (loading()) {
      <div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>
    }
    @for (s of services(); track s.id) {
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h6 class="fw-bold text-primary mb-1">&#127973; {{ s.nomService }}</h6>
                <p class="text-muted small mb-0">{{ s.description || 'Pas de description' }}</p>
              </div>
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-warning" (click)="openForm(s)">&#9999;</button>
                <button class="btn btn-outline-danger" (click)="delete(s.id)">&#128465;</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
