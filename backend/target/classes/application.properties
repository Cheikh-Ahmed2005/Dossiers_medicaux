# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/pi_s3?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Initialize data.sql after JPA schema
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT
app.jwt.secret=c2VjcmV0S2V5Rm9yTWVkaWNhbERvc3NpZXJTeXN0ZW0yMDI0UElTMw==
app.jwt.expiration=86400000

# Logging
logging.level.com.medical=DEBUG
logging.level.org.springframework.security=DEBUG
